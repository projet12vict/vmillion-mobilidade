# Deploy automático de public/ para o servidor de produção a cada push em main.
#
# Este workflow só funciona depois de definirem 3 segredos no repositório
# GitHub (Settings -> Secrets and variables -> Actions -> New repository
# secret): SSH_PRIVATE_KEY, REMOTE_HOST, REMOTE_USER, REMOTE_TARGET.
# Sem eles, o job falha no passo "Deploy via SSH" — não expõe nada, só não
# copia ficheiros. Configurem os segredos quando o servidor de produção
# estiver pronto; até lá este workflow pode ficar tal como está.
name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "public/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
