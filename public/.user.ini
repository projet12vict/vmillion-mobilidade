; V-MILLION — limites de upload do PHP.
;
; O único upload do sistema é o comprovativo de pagamento do condutor
; (Condutor\PagamentoController::solicitar), validado em 'max:5120' = 5MB.
; Os valores por omissão do PHP (upload_max_filesize 2M) descartavam o
; ficheiro ANTES de o Laravel o ver: a validação caía na regra 'required' e
; o condutor recebia "Anexe o comprovativo" mesmo tendo anexado.
;
; Folga acima dos 5MB para que um ficheiro ligeiramente acima do limite seja
; recusado pela validação (com a mensagem certa) e não pelo PHP.
; Este ficheiro é lido pelo PHP-FPM/CGI; para mod_php ver public/.htaccess.
upload_max_filesize = 6M
post_max_size = 10M
